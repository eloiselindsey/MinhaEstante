<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinhaEstante - Contato</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="logo">📚 MinhaEstante</div>
        <nav>
            <a href="index.html">Início</a>
            <a href="livros.php">Minha Estante</a>
            <a href="sobre.html">Sobre</a>
            <a href="contato.html">Contato</a>
        </nav>
    </header>

    <main>
        <section class="caixa">
            <h1>Fale conosco</h1>
            <p>Tem alguma sugestão? Escreva pra gente.</p>

            <!-- O id="formContato" é o que o JavaScript usa para encontrar este formulário -->
            <form id="formContato">

                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome">

                <label for="email">E-mail:</label>
                <input type="text" id="email" name="email">

                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="5"></textarea>

                <button type="submit" class="botao">Enviar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>MinhaEstante &copy; 2026 - Projeto acadêmico AV2</p>
    </footer>

    <!-- O JavaScript fica no final do body para carregar depois que o formulário já existe na tela -->
    <script src="js/script.js"></script>

</body>
</html>
